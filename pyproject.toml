[tool.pytest.ini_options]
testpaths = ["healer/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These entry scripts add the repo root before importing application modules.
"evals/run_evals.py" = ["E402"]
"scripts/index_runbooks.py" = ["E402"]
