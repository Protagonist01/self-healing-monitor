services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: postgres
    secrets: [postgres_password]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: healer
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    container_name: loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    container_name: grafana
    secrets: [grafana_password]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_password
    volumes:
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/self-healing-monitor.json:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    container_name: alertmanager
    secrets: [healer_api_key]
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

  leaky_service:
    build:
      context: ../demo_services/leaky_service
      dockerfile: Dockerfile
    container_name: leaky_service
    ports:
      - "127.0.0.1:${LEAKY_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: 160M
    labels:
      service: leaky_service

  flaky_service:
    build:
      context: ../demo_services/flaky_service
      dockerfile: Dockerfile
    container_name: flaky_service
    ports:
      - "127.0.0.1:${FLAKY_PORT:-8081}:8081"
    labels:
      service: flaky_service

  healer:
    build:
      context: ../healer
      dockerfile: Dockerfile
    container_name: healer
    secrets: [healer_api_key, postgres_password]
    restart: unless-stopped
    stop_grace_period: 120s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:${HEALER_PORT:-8000}:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - DATABASE_URL=postgresql://postgres@postgres:5432/healer
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - ENABLE_DEMO_ENDPOINT=${ENABLE_DEMO_ENDPOINT:-false}
      - DOCKER_ALLOWED_SERVICES=${DOCKER_ALLOWED_SERVICES:-leaky_service,flaky_service}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - AUDIT_BACKEND=postgres
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.75}
      - ALLOWED_AUTO_ACTIONS=${ALLOWED_AUTO_ACTIONS:-["RESTART_CONTAINER","NOTIFY_ONLY"]}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-30}
      - DEDUP_WINDOW_SECONDS=${DEDUP_WINDOW_SECONDS:-60}
      - MAX_AUTO_EXECUTION_RETRIES=${MAX_AUTO_EXECUTION_RETRIES:-1}
      - VERIFY_DELAY_SECONDS=${VERIFY_DELAY_SECONDS:-15}
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - CHROMA_DB_DIR=/app/chroma_db
      - RUNBOOKS_DIR=/app/runbooks
      - REQUIRE_HUMAN_APPROVAL=${REQUIRE_HUMAN_APPROVAL:-true}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - healer_chroma_db:/app/chroma_db
      - ./runbooks:/app/runbooks:ro
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
      loki:
        condition: service_started

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
      args:
        VITE_HEALER_API_URL: ${VITE_HEALER_API_URL:-http://localhost:8000}
    container_name: dashboard
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:8080"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      - healer

volumes:
  pgdata:
  healer_chroma_db:
  grafana_data:
  prometheus_data:
  alertmanager_data:
  loki_data:

secrets:
  healer_api_key:
    file: ../.secrets/healer_api_key
  postgres_password:
    file: ../.secrets/postgres_password
  grafana_password:
    file: ../.secrets/grafana_password
