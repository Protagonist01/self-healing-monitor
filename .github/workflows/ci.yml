name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: healer/requirements.txt
      - run: python -m pip install -r healer/requirements.txt ruff==0.15.18 pip-audit
      - run: python -m ruff check healer demo_services evals scripts
      - run: python -m ruff format --check healer demo_services evals scripts
      - run: python -m pytest healer/tests -q
      - run: python evals/run_evals.py
      - name: Review dependencies including expiring exceptions
        run: python scripts/audit_dependencies.py
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm audit --audit-level=moderate
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create isolated local credentials
        run: python scripts/init_secrets.py
      - name: Validate and build every project image
        run: |
          docker compose --env-file .env.example -f infra/docker-compose.yml config --quiet
          docker compose --env-file .env.example -f infra/docker-compose.yml build
      - name: Validate telemetry configurations
        run: |
          docker compose --env-file .env.example -f infra/docker-compose.yml run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
          docker compose --env-file .env.example -f infra/docker-compose.yml run --rm --no-deps --entrypoint amtool alertmanager check-config /etc/alertmanager/alertmanager.yml
      - name: Scan fixed OS vulnerabilities in project images
        run: |
          for image in infra-healer infra-dashboard infra-leaky_service infra-flaky_service; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --scanners vuln --pkg-types os --severity HIGH,CRITICAL --ignore-unfixed --timeout 15m --exit-code 1 "$image"
          done
      - name: Exercise the private stack and disposable restart
        run: |
          docker compose --env-file .env.example -f infra/docker-compose.yml up -d --wait --wait-timeout 180
          python scripts/smoke_deployment.py --exercise-restart
      - name: Container diagnostics
        if: failure()
        run: docker compose --env-file .env.example -f infra/docker-compose.yml logs --tail 80
      - name: Stop this job's stack
        if: always()
        run: docker compose --env-file .env.example -f infra/docker-compose.yml down
